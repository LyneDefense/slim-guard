[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slim-guard"
version = "0.1.0"
description = "A WeCom Customer Service bridge for the SlimGuard agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "types-defusedxml>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slim_guard"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".python", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["slim_guard"]
