<style>

<script>
(() => {
  const root = document.getElementById('cx-style-studio');
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const initialTone = '简短、克制、直接，像一个不多话但有判断的医生。\n先回应眼前这件事，不重复整段背景，不主动展开一堂课。\n可以冷淡，不敷衍、不挖苦；需要解释或提示风险时，说清楚。';
  const initialAvoid = '不套用鼓励和安慰，不在结尾机械追问，不用训话口吻。';
  const initialExamples = [
    {id:'exercise', turns:[{user:'我今天不想运动。', doctor:'今天休息。别一直休息。'}]},
    {id:'meal', turns:[{user:'晚餐吃了米饭、鸡蛋和白菜。', doctor:'搭配可以。份量还不清楚。'}]},
    {id:'greeting', turns:[{user:'你好。', doctor:'来了。今天怎么样？'},{user:'今天没什么特别的。',doctor:'那就照常。'}]}
  ];
  const stores = {};
  const restorers = {};
  const remembered = window.openai?.widgetState;
  const savedState = remembered?.privateContent?.studios || {};
  function persist() {
    const reduced = {};
    Object.entries(stores).forEach(([key, state]) => { reduced[key] = {tone:state.tone,avoid:state.avoid,examples:state.examples,rev:state.rev,savedRev:state.savedRev,publishedRev:state.publishedRev,active:state.active,activeTone:state.activeTone,tab:state.tab}; });
    const current = root.querySelector('[data-variant]:not([hidden])')?.dataset.variant;
    const privateContent = new TextEncoder().encode(JSON.stringify(reduced)).length<14000 ? {studios:reduced} : {layout:current};
    const request = window.openai?.setWidgetState?.({modelContent:{prototype:'医生表达风格工作台',layout:current,realModelCalls:false,realPublication:false},privateContent});
    request?.catch?.(() => {});
  }
  function refreshIcons() { if (globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}}); }
  root.querySelectorAll('[data-variant]').forEach((variant, index) => {
    const key = index ? 'focus' : 'split';
    const old = savedState[key];
    const validSaved = old && typeof old.tone==='string' && Array.isArray(old.examples) && old.examples.length<15;
    const state = stores[key] = {
      tone:validSaved?old.tone:initialTone, avoid:validSaved?old.avoid:initialAvoid,
      examples:validSaved?old.examples:structuredClone(initialExamples), rev:validSaved?old.rev:2,
      savedRev:validSaved?old.savedRev:2, publishedRev:validSaved?old.publishedRev:1,
      active:validSaved?old.active:3, activeTone:validSaved&&typeof old.activeTone==='string'?old.activeTone:'自然、直接，回答问题时保留必要的解释。', tab:validSaved?old.tab:'chat', chatRev:2,
      messages:[{role:'user',text:'我今天不想运动。'},{role:'doctor',text:'今天休息。别一直休息。',user:'我今天不想运动。'}], dense:false
    };
    state.chatRev = state.rev;
    variant.innerHTML = `
      <div class="cx-window ${index?'cx-focus':''}" aria-label="${index?'聚焦试聊':'并排编辑'}工作台">
        <div class="cx-shell">
          <aside class="cx-sidebar" aria-label="管理后台导航">
            <div class="cx-brand"><span class="cx-brandmark">${icon('scale')}</span>称小二</div>
            <div class="cx-navlabel">运行观察</div>
            <div class="cx-navitem">${icon('workflow')}调用过程</div>
            <div class="cx-navitem">${icon('chart-no-axes-column')}模型用量</div>
            <div class="cx-navlabel">配置与管理</div>
            <div class="cx-navitem">${icon('users')}用户管理</div>
            <div class="cx-navitem cx-current" aria-current="page">${icon('messages-square')}表达风格</div>
            <div class="cx-navitem">${icon('library')}营养知识库</div>
            <div class="cx-sidebar-foot">${icon('shield-check')} 管理操作留痕<br><br>当前账号<br>operator</div>
          </aside>
          <div class="cx-page">
            <header class="cx-topbar"><span class="cx-breadcrumb-extra">配置与管理 /</span><span>表达风格 /</span><strong>医生教练</strong><span class="cx-prototype">交互原型 · 示例数据</span></header>
            <main class="cx-main">
              <header class="cx-titlebar"><div><h1>医生表达风格</h1><p>设定怎么说，用实际对话试一试。</p></div><div class="cx-actions"><button type="button" class="cursor-interaction cx-quiet" data-action="history">${icon('history')}历史版本</button><button type="button" class="cursor-interaction" data-action="save">保存草稿</button><button type="button" class="cursor-interaction cx-primary" data-action="publish">发布并启用${icon('arrow-up-right')}</button></div></header>
              <div class="cx-statusbar"><div class="cx-statusgroup"><span class="cx-badge cx-good"><span class="cx-dot"></span><span data-active></span></span><span class="cx-muted">→</span><span class="cx-badge cx-warm" data-draftstatus></span></div><span class="cx-muted" data-savehint></span></div>
              ${index?`<div class="cx-tabs" role="tablist" aria-label="风格工作区"><button type="button" class="cursor-interaction" role="tab" data-tab="chat" id="cx-${key}-chat-tab" aria-controls="cx-${key}-preview">试聊</button><button type="button" class="cursor-interaction" role="tab" data-tab="tone" id="cx-${key}-tone-tab" aria-controls="cx-${key}-tone">角色设定</button><button type="button" class="cursor-interaction" role="tab" data-tab="examples" id="cx-${key}-examples-tab" aria-controls="cx-${key}-examples">对话示例</button></div>`:''}
              <div class="cx-workspace">
                <div class="cx-editor">
                  <section class="cx-panel" id="cx-${key}-tone" ${index?`role="tabpanel" aria-labelledby="cx-${key}-tone-tab"`:''}>
                    <header class="cx-panelhead"><div class="cx-paneltitle">${icon('sliders-horizontal')}<h2>角色设定</h2></div><button type="button" class="cursor-interaction cx-small cx-quiet" data-action="organize">${icon('sparkles')}AI 帮我整理</button></header>
                    <div class="cx-panelbody"><label class="cx-field"><span>表达方式</span><textarea class="cx-styleinput" data-tone maxlength="1000" aria-label="表达方式">${escape(state.tone)}</textarea></label><details><summary class="cursor-interaction">避免的表达</summary><label class="cx-field"><span>可选，描述不希望出现的口吻</span><textarea data-avoid maxlength="1000" aria-label="避免的表达">${escape(state.avoid)}</textarea></label></details></div>
                    <div class="cx-roleboundary">${icon('shield-check')}<div><strong>固定职责</strong><br>只点评和对话，不执行记录、不播报操作结果。事实与医疗安全边界不随风格改变。</div></div>
                  </section>
                  <section class="cx-panel" id="cx-${key}-examples" ${index?`role="tabpanel" aria-labelledby="cx-${key}-examples-tab"`:''}>
                    <header class="cx-panelhead"><div><h2>对话示例 <span class="cx-muted cx-smalltext" data-count></span></h2><p>直接写你认可的回答，支持多轮。</p></div><button type="button" class="cursor-interaction cx-small" data-action="add">${icon('plus')}添加</button></header>
                    <div class="cx-examplelist" data-examples></div><div class="cx-examplefoot">示例只用于学习表达，不作为当前用户的事实。</div>
                  </section>
                </div>
                <section class="cx-panel cx-preview" id="cx-${key}-preview" ${index?`role="tabpanel" aria-labelledby="cx-${key}-chat-tab"`:''}>
                  <header class="cx-panelhead"><div class="cx-paneltitle">${icon('message-circle')}<h2>试聊</h2><span class="cx-badge">当前草稿</span></div><button type="button" class="cursor-interaction cx-quiet cx-small" data-action="restart">${icon('rotate-ccw')}新对话</button></header>
                  <div class="cx-previewmeta"><span>示例对话演示 · 不调用模型</span><span>不写入用户记录</span></div>
                  <div class="cx-stale" data-stale hidden>草稿已更新，已有对话使用的是旧设定。<button type="button" class="cursor-interaction cx-small cx-quiet" data-action="restart">用新草稿重新试聊${icon('arrow-right')}</button></div>
                  <div class="cx-chat" data-chat aria-live="polite"></div>
                  <div class="cx-suggestions"><button type="button" class="cursor-interaction" data-scene="greeting">日常聊天</button><button type="button" class="cursor-interaction" data-scene="exercise">不想运动</button><button type="button" class="cursor-interaction" data-scene="meal">一餐点评</button></div>
                  <div class="cx-compose"><label><span class="cx-muted cx-smalltext">试聊消息</span><textarea data-input placeholder="输入一句话，看看医生会怎么回应…" aria-label="试聊消息" maxlength="500"></textarea></label><div class="cx-composefoot"><span class="cx-muted cx-smalltext">原型为预设演示，不代表真实生成效果</span><button type="button" data-send class="cursor-interaction cx-primary">发送${icon('arrow-up')}</button></div></div>
                </section>
              </div>
              <div class="cx-bottomnote">${icon('lock-keyhole')}<span>保存草稿不会影响线上。发布并启用后，仅后续新回复使用新版本。</span></div>
              <div class="cx-prototypestatus" data-status role="status" aria-live="polite"></div>
            </main>
          </div>
        </div>
        <div class="cx-overlayhost"></div>
      </div>`;
    const windowRoot = variant.querySelector('.cx-window');
    const query = selector => windowRoot.querySelector(selector);
    let previousFocus = null;
    function status(message) { query('[data-status]').textContent = message; }
    function renderState() {
      query('[data-active]').textContent = `线上启用 · 示例 V${state.active}`;
      query('[data-draftstatus]').textContent = state.rev===state.publishedRev?'与启用版本一致':state.rev===state.savedRev?'草稿未发布':'草稿有未保存修改';
      query('[data-draftstatus]').classList.toggle('cx-warm',state.rev!==state.publishedRev);
      query('[data-savehint]').textContent = state.rev===state.savedRev?'已保存草稿':'修改仅保留在本次预览';
      query('[data-action="save"]').disabled = state.rev===state.savedRev;
      query('[data-stale]').hidden = state.chatRev===state.rev;
      query('[data-send]').disabled = state.chatRev!==state.rev;
      query('[data-count]').textContent = `${state.examples.length} 组`;
      if(index){
        windowRoot.querySelectorAll('[data-tab]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.tab===state.tab)));
        query(`#cx-${key}-tone`).hidden = state.tab!=='tone';
        query(`#cx-${key}-examples`).hidden = state.tab!=='examples';
        query(`#cx-${key}-preview`).hidden = state.tab!=='chat';
        query('.cx-editor').hidden = state.tab==='chat';
      }
    }
    function renderExamples() {
      query('[data-examples]').innerHTML = state.examples.length?state.examples.map((example,i)=>`<article class="cx-example"><div class="cx-examplehead"><strong>示例 ${i+1}${example.turns.length>1?` · ${example.turns.length} 轮对话`:''}</strong><button type="button" class="cursor-interaction cx-icon cx-small cx-quiet" data-edit="${escape(example.id)}" aria-label="编辑示例 ${i+1}">${icon('pencil')}</button></div>${example.turns.slice(0,1).map(turn=>`<p class="cx-sampleline"><span>用户</span><span style="color:inherit">${escape(turn.user)}</span></p><p class="cx-sampleline"><span>医生</span><strong>${escape(turn.doctor)}</strong></p>`).join('')}</article>`).join(''):'<p class="cx-muted cx-smalltext" style="padding:18px 0">还没有示例。可以直接添加一段认可的对话。</p>';
      renderState(); refreshIcons();
    }
    function renderChat() {
      query('[data-chat]').innerHTML = state.messages.length?state.messages.slice(-8).map((message,i)=>`<div class="cx-message ${message.role==='user'?'cx-user':''}"><div class="cx-messagelabel">${message.role==='user'?'你':message.demo?'原型说明':'医生教练'}</div><div class="cx-bubble">${escape(message.text)}</div>${message.role==='doctor'&&!message.demo?`<div class="cx-exampleaction"><button type="button" class="cursor-interaction cx-quiet cx-small" data-adopt="${i}">${icon('bookmark-plus')}保存为示例</button></div>`:''}</div>`).join(''):'<div class="cx-muted cx-smalltext">当前草稿已就绪。选择下方场景，或输入一条消息。</div>';
      refreshIcons();
    }
    function changed() { state.rev++; renderState(); persist(); }
    function closeLayer() { query('.cx-overlayhost').innerHTML=''; query('.cx-shell').inert=false; if(previousFocus?.isConnected)previousFocus.focus(); }
    function layer(title,body,footer,{drawer=false,onSubmit}={}) {
      previousFocus=document.activeElement;
      query('.cx-shell').inert=true;
      const actions = footer?.replaceAll('type="submit"','type="button" data-confirm');
      query('.cx-overlayhost').innerHTML=`<div class="cx-layer ${drawer?'cx-drawerlayer':''}"><section class="cx-dialog ${drawer?'cx-drawer':''}" role="dialog" aria-modal="true" aria-labelledby="cx-${key}-dialogtitle"><header class="cx-dialoghead"><h2 id="cx-${key}-dialogtitle">${title}</h2><button type="button" class="cursor-interaction cx-icon cx-quiet" data-close aria-label="关闭">${icon('x')}</button></header><div data-dialogform><div class="cx-dialogbody">${body}</div>${actions?`<footer class="cx-dialogfoot">${actions}</footer>`:''}</div></section></div>`;
      query('[data-confirm]')?.addEventListener('click',event=>onSubmit?.(event));
      refreshIcons(); query('[data-close]').focus();
    }
    const cancel = '<button type="button" class="cursor-interaction" data-close>取消</button>';
    function editExample(id,seed) {
      const example=state.examples.find(item=>item.id===id);
      let turns=structuredClone(example?.turns||seed||[{user:'',doctor:''}]);
      function show(){
        layer(example?'编辑对话示例':'添加对话示例',`<p>填写一段你认可的对话。不需要原回答，也不需要关联规则。</p><div data-turns>${turns.map((turn,i)=>`<div class="cx-turnedit"><label class="cx-field"><span>第 ${i+1} 轮 · 用户</span><textarea data-turn-user="${i}" maxlength="500" required>${escape(turn.user)}</textarea></label><label class="cx-field"><span>医生回答</span><textarea data-turn-doctor="${i}" maxlength="500" required>${escape(turn.doctor)}</textarea></label></div>`).join('')}</div><button type="button" class="cursor-interaction cx-small" data-addturn>${icon('plus')}添加一轮</button><div class="cx-formerror" data-formerror role="alert"></div>`,`${example?'<button type="button" class="cursor-interaction cx-quiet cx-danger" data-delete>删除示例</button>':''}${cancel}<button type="submit" class="cursor-interaction cx-primary">保存到草稿</button>`,{onSubmit:()=>{
          const pairs=turns.map((turn,i)=>({user:query(`[data-turn-user="${i}"]`).value.trim(),doctor:query(`[data-turn-doctor="${i}"]`).value.trim()}));
          if(pairs.some(pair=>!pair.user||!pair.doctor)){query('[data-formerror]').textContent='请填写完整的用户输入和医生回答。';return;}
          if(example)state.examples=state.examples.map(item=>item.id===id?{...item,turns:pairs}:item);else state.examples.push({id:`example-${Date.now()}`,turns:pairs});
          closeLayer();changed();renderExamples();status('示例已保存到草稿，线上版本未改变。');
        }});
        query('[data-addturn]').addEventListener('click',()=>{
          turns=turns.map((turn,i)=>({user:query(`[data-turn-user="${i}"]`).value,doctor:query(`[data-turn-doctor="${i}"]`).value}));
          if(turns.length>=3){query('[data-formerror]').textContent='原型最多演示三轮。';return;}
          turns.push({user:'',doctor:''});show();
        });
        query('[data-delete]')?.addEventListener('click',()=>{
          state.examples=state.examples.filter(item=>item.id!==id);closeLayer();changed();renderExamples();status('已从草稿移除示例，已发布版本不受影响。');
        });
      }
      show();
    }
    function restart() { state.messages=[];state.chatRev=state.rev;renderChat();renderState();status('已用最新草稿开始新对话。');persist(); }
    function submitChat(text) {
      if(state.chatRev!==state.rev){status('请先用最新草稿开始新对话。');return;}
      const example=state.examples.find(item=>item.turns[0]?.user===text);
      state.messages.push({role:'user',text});
      state.messages.push(example?{role:'doctor',text:example.turns[0].doctor,user:text}:{role:'doctor',text:'本原型不调用模型。正式试聊会在这里按当前草稿生成回复。',demo:true});
      renderChat();query('[data-input]').value='';persist();
    }
    query('[data-tone]').addEventListener('input',event=>{state.tone=event.target.value;changed();});
    query('[data-avoid]').addEventListener('input',event=>{state.avoid=event.target.value;changed();});
    query('[data-send]').addEventListener('click',()=>{const value=query('[data-input]').value.trim();if(value)submitChat(value);else query('[data-input]').focus();});
    windowRoot.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button)return;
      if(button.hasAttribute('data-close')){closeLayer();return;}
      if(button.dataset.tab){state.tab=button.dataset.tab;renderState();persist();return;}
      if(button.dataset.edit){editExample(button.dataset.edit);return;}
      if(button.dataset.adopt!==undefined){const message=state.messages.slice(-8)[Number(button.dataset.adopt)];if(message?.user)editExample(null,[{user:message.user,doctor:message.text}]);return;}
      if(button.dataset.scene){const item=state.examples.find(example=>example.id===button.dataset.scene)||initialExamples.find(example=>example.id===button.dataset.scene);if(state.chatRev!==state.rev)restart();submitChat(item.turns[0].user);return;}
      switch(button.dataset.action){
        case 'save':state.savedRev=state.rev;renderState();persist();status('模拟：草稿已保存，线上版本未改变。');break;
        case 'restart':restart();break;
        case 'add':editExample(null);break;
        case 'organize':
          layer('AI 帮我整理',`<p>这是可选辅助。正式功能根据你的文字和示例提出修改，不会自动覆盖。</p><label class="cx-field"><span>建议的表达说明 · 原型示例</span><textarea data-suggested class="cx-styleinput">${escape(state.tone)}</textarea></label><div class="cx-dialognote">本原型没有调用模型。你可以修改以上文字，确认后合入草稿。</div>`,`${cancel}<button type="submit" class="cursor-interaction cx-primary">采用到草稿</button>`,{onSubmit:()=>{const value=query('[data-suggested]').value.trim();if(!value)return;state.tone=value;query('[data-tone]').value=value;closeLayer();changed();status('建议已合入草稿，还没有发布。');}});break;
        case 'publish':
          if(!state.tone.trim()){status('请先填写表达方式。');query('[data-tone]').focus();break;}
          layer('发布并启用',`<p>确认这份草稿将成为后续新回复使用的版本。历史对话不会重写。</p><div class="cx-confirmlist"><div class="cx-confirmitem"><span>风格</span><strong>医生教练</strong></div><div class="cx-confirmitem"><span>替换版本</span><strong>示例 V${state.active} → 示例 V${state.active+1}</strong></div><div class="cx-confirmitem"><span>对话示例</span><strong>${state.examples.length} 组</strong></div><div class="cx-confirmitem"><span>生效范围</span><strong>后续新回复</strong></div></div><div class="cx-dialognote">交互演示，不会真正发布。正式功能需完成配置校验和必要的职责／安全检查；本原型未执行这些检查。</div>`,`${cancel}<button type="submit" class="cursor-interaction cx-primary">模拟发布并启用</button>`,{onSubmit:()=>{state.active++;state.activeTone=state.tone;state.publishedRev=state.rev;state.savedRev=state.rev;closeLayer();renderState();persist();status(`模拟完成：示例 V${state.active} 已启用。没有修改真实后台。`);}});break;
        case 'history':
          layer('历史版本',`<p>保留每次发布时的设定和示例。旧版本可先加载为草稿，试聊后再发布。</p>${[state.active,state.active-1,state.active-2].filter(number=>number>0).map((number,i)=>`<article class="cx-versionrow"><div class="cx-versiontop"><strong>示例 V${number}</strong>${i===0?'<span class="cx-badge cx-good">当前启用</span>':'<span class="cx-muted cx-smalltext">历史版本</span>'}</div><p>${i===0?'当前线上使用的表达配置。':'上一版表达设定与对话示例。'}</p><details><summary class="cursor-interaction">查看配置</summary><p>${escape(i===0?state.activeTone:'说话自然直接，减少解释和重复。')}</p></details>${i?`<button type="button" class="cursor-interaction cx-small" data-loadversion="${number}">${icon('corner-up-left')}加载为草稿</button>`:''}</article>`).join('')}`,null,{drawer:true});
          windowRoot.querySelectorAll('[data-loadversion]').forEach(load=>load.addEventListener('click',()=>{state.tone='说话自然直接，减少解释和重复。';query('[data-tone]').value=state.tone;closeLayer();changed();if(index){state.tab='tone';renderState();}status(`已将示例 V${load.dataset.loadversion} 的配置加载为草稿，线上版本未改变。`);}));break;
      }
    });
    windowRoot.addEventListener('keydown',event=>{
      if(!query('[role="dialog"]'))return;
      if(event.key==='Escape'){closeLayer();event.preventDefault();}
      if(event.key==='Tab'){
        const controls=[...query('[role="dialog"]').querySelectorAll('button:not(:disabled),input,textarea,select,summary')];
        const first=controls[0],last=controls.at(-1);
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
      }
    });
    restorers[key] = value => {
      if(!value||typeof value.tone!=='string'||typeof value.avoid!=='string'||!Array.isArray(value.examples))return;
      Object.assign(state,{tone:value.tone,avoid:value.avoid,examples:value.examples,rev:value.rev,savedRev:value.savedRev,publishedRev:value.publishedRev,active:value.active,activeTone:value.activeTone||state.activeTone,tab:value.tab});
      query('[data-tone]').value=state.tone;query('[data-avoid]').value=state.avoid;
      renderExamples();renderState();
    };
    renderExamples();renderChat();renderState();
    if(globalThis.Tweak){const tweak=new Tweak({container:windowRoot,onChange:()=>{windowRoot.dataset.dense=String(state.dense);}});tweak.addToggle(state,'dense',{label:'紧凑间距'});}
  });
  window.addEventListener('openai:set_globals',event=>{
    const update=event.detail?.globals?.widgetState?.privateContent?.studios;
    if(!update)return;
    Object.entries(update).forEach(([key,value])=>restorers[key]?.(value));
  });
})();
</script>
